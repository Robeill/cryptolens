[project]
name = "cryptolens"
version = "0.1.0"
description = "Cryptographic inventory and CBOM/PQC migration scanner"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "asn1crypto>=1.5",
    "cyclonedx-python-lib==11.12.0",
    "typer>=0.27.1",
]
readme = "README.md"

[project.optional-dependencies]
pqc = ["liboqs-python"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.scripts]
cryptolens = "cryptolens.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
"src/cryptolens/certs/parser.py" = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]